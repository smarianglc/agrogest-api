services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agrogest
      POSTGRES_PASSWORD: agrogest
      POSTGRES_DB: agrogest
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrogest -d agrogest"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://agrogest:agrogest@db:5432/agrogest
      BUGS_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
